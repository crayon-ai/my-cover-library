<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>封面收藏库 · 孙涛</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#FBF8F1;--card:#fff;--ink:#1F2A24;--muted:#6B746E;--line:#E9E3D6;--green:#2F6B4F;--green-soft:#E3EFE7;--peach:#F6C9A8;--lemon:#FCEFA6;--r:20px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:48px 24px 80px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin:0;letter-spacing:-.02em;font-weight:800}
h1 .hl{background:linear-gradient(transparent 62%,var(--lemon) 62%);padding:0 4px}
.sub{color:var(--muted);margin:10px 0 0;font-size:15px}
.stat{font-size:14px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--green);font-size:22px;margin-right:2px}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0;margin:0 0 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
.tab:hover{border-color:var(--green)}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.tab .n{opacity:.6;margin-left:6px;font-size:12px}
.search{flex:1 1 220px;max-width:320px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px 10px 38px;font-size:14px;color:var(--ink);outline:none;font-family:inherit}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -14px rgba(31,42,36,.28)}
.thumb{aspect-ratio:3/4;background:#F1ECE1;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .thumb img{transform:scale(1.03)}
.meta{padding:12px 14px 14px}
.title{font-size:14px;font-weight:600;line-height:1.4;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.chip{background:var(--green-soft);color:var(--green);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.empty{text-align:center;padding:90px 20px;border:2px dashed var(--line);border-radius:28px;background:var(--card)}
.empty .big{font-size:44px}
.empty h3{margin:12px 0 6px;font-size:20px}
.empty p{color:var(--muted);margin:0}
.lb{position:fixed;inset:0;background:rgba(251,248,241,.94);backdrop-filter:blur(6px);display:none;z-index:20;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb-box{display:flex;gap:28px;max-width:1000px;width:100%;max-height:100%;background:var(--card);border-radius:28px;padding:20px;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(31,42,36,.35)}
.lb-img{flex:0 0 auto;width:min(420px,48vw);aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#F1ECE1}
.lb-img img{width:100%;height:100%;object-fit:contain;display:block}
.lb-info{flex:1;min-width:0;overflow:auto;padding:8px 4px}
.lb-info h2{margin:10px 0 14px;font-size:24px;line-height:1.3}
.lb-info dl{margin:0;display:grid;grid-template-columns:56px 1fr;gap:10px 12px;font-size:14px}
.lb-info dt{color:var(--muted)}
.lb-info dd{margin:0;line-height:1.6;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--lemon);border-radius:999px;padding:1px 10px;font-size:12px}
.lb-actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--green);color:var(--green)}
.x{position:fixed;top:18px;right:18px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}
.nav.prev{left:18px}.nav.next{right:18px}
footer{margin-top:60px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:720px){
 .wrap{padding:28px 14px 60px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .meta{padding:10px}
 .title{font-size:13px}
 .search{max-width:none}
 .lb{padding:0;align-items:stretch}
 .lb-box{flex-direction:column;border-radius:0;padding:16px;overflow:auto;gap:14px}
 .lb-img{width:100%;max-width:420px;margin:0 auto}
 .nav{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>我的<span class="hl">封面</span>收藏库</h1>
      <p class="sub">小红书好封面，看到就存。在对话里发给我，我来入库和分类。</p>
    </div>
    <div class="stat" id="stat"></div>
  </header>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜标题 / 备注 / 标签">
    </label>
  </div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbx" aria-label="关闭">×</button>
  <button class="nav prev" id="lbp" aria-label="上一张">‹</button>
  <button class="nav next" id="lbn" aria-label="下一张">›</button>
  <div class="lb-box">
    <div class="lb-img"><img id="lbimg" alt=""></div>
    <div class="lb-info" id="lbinfo"></div>
  </div>
</div>
<script>
const S={cat:null,list:[],cur:'all',q:'',idx:-1};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src=p=>encodeURI(p);
const catName=id=>(S.cat.categories.find(c=>c.id===id)||{name:id}).name;

fetch('catalog.json?t='+Date.now()).then(r=>r.json()).then(d=>{S.cat=d;init()}).catch(e=>{
  $('main').innerHTML='<div class="empty"><div class="big">⚠️</div><h3>索引读取失败</h3><p>'+esc(e.message)+'</p></div>';
});

function init(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h&&S.cat.categories.some(c=>c.id===h))S.cur=h;
  const n=S.cat.covers.length;
  $('stat').innerHTML='<b>'+n+'</b> 张封面 · '+S.cat.categories.length+' 个分类';
  if(S.cat.updatedAt)$('foot').textContent='最近更新 '+S.cat.updatedAt.replace('T',' ').slice(0,16)+' · 数据存放在 GitHub 仓库 my-cover-library';
  $('q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();render()});
  render();
}
function filtered(){
  return S.cat.covers.filter(c=>(S.cur==='all'||c.category===S.cur)&&(!S.q||[c.title,c.note,(c.tags||[]).join(' '),c.source,c.id].join(' ').toLowerCase().includes(S.q)))
    .slice().sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||'')||b.id.localeCompare(a.id));
}
function render(){
  const all=S.cat.covers;
  const tabs=[{id:'all',name:'全部',n:all.length}].concat(S.cat.categories.map(c=>({id:c.id,name:c.name,n:all.filter(x=>x.category===c.id).length})));
  $('tabs').innerHTML=tabs.map(t=>`<button class="tab${t.id===S.cur?' on':''}" data-id="${esc(t.id)}">${esc(t.name)}<span class="n">${t.n}</span></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.cur=b.dataset.id;history.replaceState(null,'',S.cur==='all'?location.pathname:'#'+encodeURIComponent(S.cur));render()});
  S.list=filtered();
  if(!all.length){$('main').innerHTML='<div class="empty"><div class="big">🗂️</div><h3>还没有封面</h3><p>在对话里发给我就能入库</p></div>';return}
  if(!S.list.length){$('main').innerHTML='<div class="empty"><div class="big">🔍</div><h3>'+(S.q?'没搜到相关封面':'这个分类还空着')+'</h3><p>'+(S.q?'换个关键词试试':'在对话里告诉我把哪些封面放进来')+'</p></div>';return}
  $('main').innerHTML='<div class="grid">'+S.list.map((c,i)=>`<article class="card" data-i="${i}">
    <div class="thumb"><img loading="lazy" src="${esc(src(c.path))}" alt="${esc(c.title)}"></div>
    <div class="meta"><p class="title">${esc(c.title)}</p><div class="row"><span class="chip">${esc(catName(c.category))}</span><span>${esc(c.addedAt||'')}</span></div></div>
  </article>`).join('')+'</div>';
  $('main').querySelectorAll('.card').forEach(el=>el.onclick=()=>open(+el.dataset.i));
}
function open(i){
  S.idx=i;const c=S.list[i];if(!c)return;
  $('lbimg').src=src(c.path);$('lbimg').alt=c.title;
  const tags=(c.tags||[]).length?`<div class="tags">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:'—';
  $('lbinfo').innerHTML=`<span class="chip">${esc(catName(c.category))}</span><h2>${esc(c.title)}</h2>
  <dl><dt>编号</dt><dd>${esc(c.id)}</dd><dt>备注</dt><dd>${esc(c.note||'—')}</dd><dt>标签</dt><dd>${tags}</dd>
  <dt>入库</dt><dd>${esc(c.addedAt||'—')}</dd><dt>来源</dt><dd>${esc(c.source||'—')}</dd></dl>
  <div class="lb-actions"><a class="btn" href="${esc(src(c.path))}" target="_blank" rel="noopener">查看原图</a><a class="btn" href="${esc(src(c.path))}" download>下载</a></div>`;
  $('lb').classList.add('on');document.body.style.overflow='hidden';
}
function close(){$('lb').classList.remove('on');document.body.style.overflow=''}
function step(d){if(!S.list.length)return;open((S.idx+d+S.list.length)%S.list.length)}
$('lbx').onclick=close;$('lbp').onclick=()=>step(-1);$('lbn').onclick=()=>step(1);
$('lb').onclick=e=>{if(e.target===$('lb'))close()};
document.addEventListener('keydown',e=>{if(!$('lb').classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
</script>
</body>
</html>
